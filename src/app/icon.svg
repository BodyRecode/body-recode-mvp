<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200.00 200.00" width="200.00" height="200.00" role="img" aria-label="Body Recode">
  <style>
    /* A monochrome mark has exactly one problem: a graphite square vanishes on a
       dark browser tab strip, and a paper one vanishes on a light strip. So the
       icon inverts with the strip. This is the only reason the app ships an SVG
       icon as well as an .ico, and the .ico stays graphite for browsers that
       will not read this. */
    .sq { fill: #0F1115 }
    .lt { fill: #FAFAF8 }
    @media (prefers-color-scheme: dark) {
      .sq { fill: #FAFAF8 }
      .lt { fill: #0F1115 }
    }
  </style>
